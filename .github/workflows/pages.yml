name: Deploy Archive Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack static Mini App from ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import shutil
          import zipfile

          packages = sorted(pathlib.Path(".").glob("ARHIV_8_6_GITHUB_PAGES_READY*.zip"))
          if not packages:
              raise SystemExit("Upload ARHIV_8_6_GITHUB_PAGES_READY.zip via Add file -> Upload files first.")
          package = max(packages, key=lambda p: p.stat().st_mtime)
          print("Unpacking Mini App package:", package)
          target = pathlib.Path("public")
          target.mkdir(exist_ok=True)
          base = target.resolve()
          with zipfile.ZipFile(package) as bundle:
              for entry in bundle.infolist():
                  if entry.is_dir():
                      continue
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError("Unsafe archive entry: " + entry.filename)
                  # Publish only a static website; never deploy private backend files.
                  if path.suffix.lower() not in {".html", ".js", ".css", ".json", ".jpg", ".jpeg", ".png", ".gif", ".webp", ".svg", ".mp4", ".webm"} and path.name != ".nojekyll":
                      continue
                  destination = target.joinpath(*path.parts)
                  if not destination.resolve().is_relative_to(base):
                      raise ValueError("Unsafe output path")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with bundle.open(entry) as src, destination.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
          for required in ("index.html", "data/stories.json", "media/story_01.jpg"):
              if not (target / required).is_file():
                  raise SystemExit("Required site file missing: " + required)
          (target / ".nojekyll").touch()
          print("Mini App files extracted successfully")
          PY
      - name: Render three animated story scenes for every story
        shell: bash
        run: |
          python3 -m pip install --quiet "Pillow>=10,<13"
          python3 scripts/build_scene_gifs.py public
          test -f public/data/scene-manifest.json
      - name: Install full-screen one-story TikTok mode
        shell: bash
        run: |
          cp tiktok-mode.css public/tiktok-mode.css
          cp tiktok-mode.js public/tiktok-mode.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/index.html")
          html = page.read_text(encoding="utf-8")
          if "</head>" not in html or "</body>" not in html:
              raise SystemExit("Archive index.html has missing HTML tags")
          html = html.replace("</head>", '<link rel="stylesheet" href="tiktok-mode.css?v=9.2.0">\n</head>', 1)
          html = html.replace("</body>", '<script src="tiktok-mode.js?v=9.2.0"></script>\n</body>', 1)
          html = html.replace("ЛЕНТА УЖАСОВ · БЕЗ КНОПОК", "ОДНА ИСТОРИЯ ЗА РАЗ")
          html = html.replace("Читай всю историю, просто проводя пальцем вверх. После заключения следующая история появится автоматически, без нажатия кнопки.",
            "На экране одна история. Читай текст внутри неё, свайпни вверх в конце или нажми «Далее». Лайк и дизлайк откроют следующее дело с анимацией.")
          html = html.replace("Ниже — полная запись. Продолжай листать вниз, чтобы перейти к следующей истории.",
            "Полная запись. Прокручивай текст, а в конце свайпни вверх для следующего дела.")
          page.write_text(html, encoding="utf-8")
          PY
      - name: Add optional Cloudflare D1 user sync (no secrets in website)
        shell: bash
        run: |
          cp archive-cloud-config.js public/archive-cloud-config.js
          cp archive-cloud.js public/archive-cloud.js
          cp archive-cloud.css public/archive-cloud.css
          python3 - <<'PY'
          from pathlib import Path
          index=Path("public/index.html")
          html=index.read_text(encoding="utf-8")
          if "</head>" not in html or "</body>" not in html:
              raise SystemExit("Archive HTML is malformed")
          html=html.replace("</head>", '<link rel="stylesheet" href="archive-cloud.css?v=9.1.0">\n</head>', 1)
          scripts='<script src="archive-cloud-config.js?v=9.1.0"></script>\n<script src="archive-cloud.js?v=9.1.0"></script>\n'
          html=html.replace("</body>", scripts+"</body>", 1)
          index.write_text(html, encoding="utf-8")
          PY
      - name: Set up Node for Mini App checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test one-story mode (like / dislike / next)
        shell: bash
        run: |
          node --check public/tiktok-mode.js
          node --check public/archive-cloud.js
          npm install --no-save --no-package-lock jsdom@26.1.0
          node .github/tests/deck-smoke.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
